name: Notify Slack on Failure

on:
  workflow_call:
    secrets:
      slack_bot_token:
        description: "Slack Appのボットトークン (xoxb-...)"
        required: true
      slack_channel_id:
        description: "通知先のSlackチャンネルID"
        required: true

jobs:
  notify:
    runs-on: ubuntu-24.04
    steps:
      - name: Send failure notification to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.slack_bot_token }}
          payload: |
            channel: "${{ secrets.slack_channel_id }}"
            text: "GitHub Actions Workflow Failed: ${{ github.repository }}"
            attachments:
              - color: "#FF0000"
                blocks:
                  - type: section
                    text:
                      type: mrkdwn
                      text: |
                        :x: *GitHub Actions Workflow Failed*
                        *Repository:* ${{ github.repository }}
                        *Branch:* ${{ github.ref_name }}
                        *Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}> ${{ github.event.head_commit.message || github.event.pull_request.title || '' }}
                        *Workflow:* ${{ github.workflow }}
                        *Log:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

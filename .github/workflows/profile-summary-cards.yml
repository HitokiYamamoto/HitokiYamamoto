name: GitHub-Profile-Summary-Cards

on:
    schedule:
        - cron: "0 0 * * 0" # 毎週日曜日の午前0時(UTC)に実行
    workflow_dispatch: # 手動実行も可能

jobs:
    build:
        runs-on: ubuntu-latest
        name: Generate GitHub Cards
        permissions:
            contents: write

        steps:
            - name: Checkout Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  token: ${{ secrets.PROFILE_SUMMARY_TOKEN }}

            - name: Generate Profile Summary Cards
              uses: vn7n24fzkq/github-profile-summary-cards@4a9822e91a20eae650b9591769569976f0d578ba # release
              env:
                  GITHUB_TOKEN: ${{ secrets.PROFILE_SUMMARY_TOKEN }}
              with:
                  USERNAME: ${{ github.repository_owner }}

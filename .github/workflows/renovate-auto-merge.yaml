name: Renovate Auto Merge

on:
  pull_request:
    # 起動回数が多いので、ラベルが付与された時だけ実行する
    types:
      - labeled

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # 条件判定:
    # 1. 'renovate' ラベルが含まれていること
    # 2. 'digest-update' または 'patch-update' または 'minor-update' ラベルが含まれていること
    if: >-
      contains(github.event.pull_request.labels.*.name, 'renovate') &&
      (contains(github.event.pull_request.labels.*.name, 'digest-update') ||
       contains(github.event.pull_request.labels.*.name, 'patch-update') ||
       contains(github.event.pull_request.labels.*.name, 'minor-update'))
    steps:
      - name: Enable Auto-merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --merge
